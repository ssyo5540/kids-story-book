# Eight Chirp 3 HD voices used in every locale (four female, four male).
# Voice ids are <locale>-Chirp3-HD-<name>. Personas are the kid-facing names shown in the app.
chirpVoices:
  - { name: Aoede, gender: female }
  - { name: Kore, gender: female }
  - { name: Leda, gender: female }
  - { name: Zephyr, gender: female }
  - { name: Charon, gender: male }
  - { name: Puck, gender: male }
  - { name: Orus, gender: male }
  - { name: Iapetus, gender: male }

previewText:
  en: "Hello, little one. I am going to read you a story tonight. Snuggle in, close your eyes, and listen closely. Once upon a time, in a land far away, the stars were just beginning to twinkle."
  te: "హలో చిన్నారి. ఈ రాత్రి నేను నీకు ఒక కథ చెబుతాను. దుప్పటి కప్పుకో, కళ్ళు మూసుకో, జాగ్రత్తగా విను. అనగనగా, చాలా దూరంగా ఉన్న ఒక దేశంలో, నక్షత్రాలు మెల్లగా మెరవడం మొదలుపెట్టాయి."
  ta: "வணக்கம் குட்டி. இன்று இரவு நான் உனக்கு ஒரு கதை சொல்லப் போகிறேன். போர்வையைப் போர்த்திக்கொள், கண்களை மூடு, கவனமாகக் கேள். ஒரு காலத்தில், வெகு தொலைவில் உள்ள ஒரு நாட்டில், நட்சத்திரங்கள் மெதுவாக மின்னத் தொடங்கின."
  kn: "ನಮಸ್ಕಾರ ಪುಟ್ಟ. ಇಂದು ರಾತ್ರಿ ನಾನು ನಿನಗೆ ಒಂದು ಕಥೆ ಹೇಳುತ್ತೇನೆ. ಹೊದಿಕೆ ಹೊದ್ದುಕೋ, ಕಣ್ಣು ಮುಚ್ಚು, ಗಮನವಿಟ್ಟು ಕೇಳು. ಒಂದಾನೊಂದು ಕಾಲದಲ್ಲಿ, ಬಹಳ ದೂರದ ಒಂದು ದೇಶದಲ್ಲಿ, ನಕ್ಷತ್ರಗಳು ನಿಧಾನವಾಗಿ ಮಿನುಗಲು ಆರಂಭಿಸಿದವು."
  ml: "ഹലോ കുഞ്ഞേ. ഇന്ന് രാത്രി ഞാൻ നിനക്കൊരു കഥ പറയാം. പുതപ്പ് പുതച്ച്, കണ്ണടച്ച്, ശ്രദ്ധിച്ചു കേൾക്കൂ. പണ്ടു പണ്ട്, വളരെ ദൂരെയുള്ള ഒരു നാട്ടിൽ, നക്ഷത്രങ്ങൾ പതിയെ മിന്നാൻ തുടങ്ങി."

