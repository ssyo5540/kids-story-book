sourceNotes: "Plutarch and the Pyramid Texts, heavily softened: Set closes Osiris in a chest and floats it down the Nile; Isis searches and finds him at Byblos; Set hides the chest again in the marshes; Isis, Nephthys, Anubis and Thoth find him and he chooses to rule the peaceful Field of Reeds. No violence is described."
